<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pet Hotel — Grammar, 4 класс</title>
<style>
:root{
  --wine:#7c1649;
  --pink:#e83f8f;
  --gold:#f4b632;
  --cream:#fff8e8;
  --blue:#2568d8;
  --ink:#39243f;
  --green:#31b767;
  --red:#e65367;
  --line:#edd3aa;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif;background:linear-gradient(180deg,#fff7ea,#f8e9f1);color:var(--ink)}
button,select{font:inherit}
.hidden{display:none!important}

.page{width:min(1100px,100%);margin:0 auto;padding:14px}
.hotel-shell{background:#fffdf8;border:3px solid #f0d4a4;border-radius:28px;box-shadow:0 16px 36px rgba(90,44,70,.14);overflow:hidden}

/* HOTEL SHOWCASE */
#hotelView{padding:12px}
.hotel-stage{position:relative;width:min(100%,820px);margin:0 auto;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 12px 28px rgba(111,42,83,.18)}
.hotel-stage img{width:100%;height:auto;display:block}
.room-hit{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:24px;transition:.18s ease;outline:none}
.room-hit:focus-visible{box-shadow:0 0 0 5px rgba(255,255,255,.95),0 0 0 9px var(--gold)}
@media (hover:hover) and (pointer:fine){
  .room-hit:hover{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 4px rgba(255,255,255,.72)}
}
.room-hit::after{content:"";position:absolute;inset:0;border-radius:24px;box-shadow:inset 0 0 0 0 var(--gold);transition:.18s ease}
.room-hit:hover::after{box-shadow:inset 0 0 0 4px var(--gold)}
.r1{left:18%;top:37%;width:31%;height:26%}
.r2{left:51%;top:37%;width:31%;height:26%}
.r3{left:18%;top:64%;width:31%;height:26%}
.r4{left:51%;top:64%;width:31%;height:26%}

.hotel-tip{text-align:center;margin:11px auto 2px;font-weight:900;color:var(--wine);font-size:clamp(16px,2vw,21px)}
.hotel-tip span{display:inline-block;background:#fff0c7;border:2px solid #f0c05c;border-radius:999px;padding:8px 15px}

/* TASK */
#taskView{padding:10px}
.task-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.back-btn,.mini-btn{border:0;border-radius:14px;background:#fff1c9;color:#71364f;font-weight:900;padding:10px 14px;cursor:pointer;box-shadow:inset 0 0 0 2px #efcf87}
.back-btn:hover,.mini-btn:hover{background:#ffe59c}
.task-count{font-weight:900;color:var(--wine);background:#fff;border:2px solid #ebd9ba;border-radius:999px;padding:8px 13px}

.task-card{background:#fff;border:3px solid #ead0a7;border-radius:26px;box-shadow:0 14px 32px rgba(92,52,65,.13);overflow:hidden}
.task-head{background:linear-gradient(135deg,#8d1856,#cf3f87);color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.task-head h1{margin:0;font-size:clamp(27px,4vw,43px);line-height:1}
.task-head .room-tag{background:#ffd25b;color:#572841;border-radius:999px;padding:8px 14px;font-weight:1000;white-space:nowrap}

.task-body{padding:18px 20px 22px}
.note{background:#fff5d8;border-left:6px solid var(--gold);border-radius:16px;padding:12px 14px;font-size:clamp(16px,1.7vw,19px);font-weight:800;line-height:1.4;margin-bottom:16px}

.story{font-size:clamp(19px,2.15vw,25px);line-height:1.85;font-weight:600}
.story-title{text-align:center;color:var(--wine);font-size:clamp(25px,3vw,34px);font-weight:1000;margin-bottom:12px}

.gap-wrap{display:inline-flex;align-items:center;background:#fffdf5;border:3px solid #82baf3;border-radius:13px;padding:4px 7px;margin:2px 3px;vertical-align:middle;transition:.2s ease}
.gap-wrap.correct{background:#e6f9ed;border-color:var(--green)}
.gap-wrap.incorrect{background:#fff0f2;border-color:var(--red)}
select{border:0;outline:none;background:transparent;font-size:.78em;font-weight:900;color:#3d3d66;max-width:175px;cursor:pointer}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.action{border:0;border-radius:14px;padding:12px 19px;font-weight:1000;cursor:pointer;color:#fff;box-shadow:0 7px 15px rgba(0,0,0,.10)}
.check{background:linear-gradient(135deg,#3cc87c,#22a95f)}
.reset{background:linear-gradient(135deg,#7c74dd,#655ac7)}
.show{background:linear-gradient(135deg,#f1a13e,#e6783a)}

.feedback{display:none;margin-top:15px;border-radius:15px;padding:12px 14px;font-size:17px;font-weight:900}
.feedback.show{display:block}
.feedback.success{background:#e4f8eb;border:3px solid #43bd78;color:#17633b}
.feedback.warn{background:#fff5d7;border:3px solid #e8aa36;color:#83520a}
.feedback.error{background:#fff0f2;border:3px solid #e66375;color:#8d2636}

.tips{display:none;margin-top:14px;background:#fff9e8;border:2px solid #efd197;border-radius:18px;padding:12px}
.tips.show{display:block}
.tip{background:#fff;border:2px solid #f0dfbd;border-radius:14px;padding:11px 12px;margin-top:8px;line-height:1.45;font-size:16px}
.tip strong{color:var(--wine)}

.progress{height:12px;border-radius:999px;background:#f1e7d5;overflow:hidden;margin:14px 0 0}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,#e83f8f,#f4b632,#43bf7b);transition:.3s}

.success-box{display:none;margin-top:15px;text-align:center;background:linear-gradient(135deg,#fff1bf,#fbe1ee);border:3px solid #e7bb69;border-radius:20px;padding:18px}
.success-box.show{display:block}
.success-box b{display:block;color:var(--wine);font-size:28px;margin-bottom:5px}

@media(max-width:700px){
  .page{padding:7px}
  #hotelView{padding:6px}
  .hotel-shell{border-radius:20px}
  .hotel-stage{border-radius:17px}
  .hotel-tip{font-size:14px}
  .hotel-tip span{padding:7px 11px}
  #taskView{padding:6px}
  .task-head{padding:14px 13px;align-items:flex-start}
  .task-head h1{font-size:26px}
  .task-head .room-tag{font-size:13px;padding:6px 10px}
  .task-body{padding:13px 11px 18px}
  .note{font-size:14px;padding:9px 10px;margin-bottom:12px}
  .story{font-size:18px;line-height:1.72}
  .story-title{font-size:24px}
  .gap-wrap{padding:4px 5px;margin:2px 1px}
  select{font-size:16px;max-width:145px}
  .actions{display:grid;grid-template-columns:1fr;gap:8px}
  .action{width:100%;min-height:46px}
  .tip{font-size:15px}
}

/* ===== MOBILE RESPONSIVE PATCH ===== */
@media (max-width: 700px) {
  html, body {
    overflow-x: hidden;
  }

  body {
    background: linear-gradient(180deg,#fff8ed,#f8edf3);
  }

  .page {
    width: 100%;
    padding: 6px;
  }

  /* HOTEL SHOWCASE */
  #hotelView {
    padding: 4px;
  }

  .hotel-shell {
    border-radius: 18px;
    border-width: 2px;
  }

  .hotel-stage {
    width: 100%;
    max-width: 100%;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(111,42,83,.14);
  }

  .hotel-stage img {
    width: 100%;
    height: auto;
    object-fit: contain;
  }

  /* clickable zones stay large enough to tap */
  .room-hit {
    border-radius: 16px;
    min-width: 44px;
    min-height: 44px;
  }

  .hotel-tip {
    margin: 8px 4px 2px;
    font-size: 13px;
    line-height: 1.25;
  }

  .hotel-tip span {
    display: block;
    width: 100%;
    padding: 8px 10px;
    border-radius: 14px;
  }

  /* TASK PAGE */
  #taskView {
    padding: 4px;
  }

  .task-top {
    gap: 6px;
    margin-bottom: 7px;
  }

  .back-btn,
  .mini-btn,
  .task-count {
    min-height: 44px;
    font-size: 14px;
  }

  .back-btn,
  .mini-btn {
    padding: 9px 11px;
    border-radius: 12px;
  }

  .task-count {
    padding: 8px 10px;
  }

  .task-card {
    border-radius: 18px;
    border-width: 2px;
    overflow: visible;
  }

  .task-head {
    padding: 12px 11px;
    gap: 8px;
    align-items: flex-start;
    border-radius: 16px 16px 0 0;
  }

  .task-head h1 {
    font-size: clamp(23px, 7vw, 29px);
    line-height: 1.05;
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .task-head .room-tag {
    flex: 0 0 auto;
    font-size: 12px;
    padding: 6px 8px;
  }

  .task-body {
    padding: 11px 9px 16px;
  }

  .note {
    font-size: 14px;
    line-height: 1.35;
    padding: 9px 10px;
    margin-bottom: 11px;
    border-left-width: 4px;
    border-radius: 12px;
  }

  .story-title {
    font-size: clamp(22px, 6.5vw, 28px);
    line-height: 1.08;
    margin-bottom: 10px;
  }

  .story {
    font-size: 18px;
    line-height: 1.68;
    word-break: normal;
    overflow-wrap: anywhere;
  }

  .gap-wrap {
    display: inline-flex;
    max-width: 100%;
    padding: 3px 5px;
    margin: 2px 1px;
    border-radius: 11px;
    vertical-align: middle;
  }

  select {
    min-height: 36px;
    max-width: min(145px, 58vw);
    font-size: 16px;
    line-height: 1.2;
    padding: 2px 2px;
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 15px;
  }

  .action {
    width: 100%;
    min-height: 48px;
    border-radius: 13px;
    padding: 11px 14px;
    font-size: 16px;
  }

  .progress {
    height: 10px;
    margin-top: 12px;
  }

  .feedback {
    font-size: 15px;
    line-height: 1.35;
    padding: 10px 11px;
    border-radius: 12px;
  }

  .tips {
    padding: 9px;
    border-radius: 14px;
  }

  .tip {
    font-size: 15px;
    line-height: 1.42;
    padding: 10px;
    margin-top: 7px;
    border-radius: 12px;
  }

  .success-box {
    padding: 14px 11px;
    border-radius: 15px;
  }

  .success-box b {
    font-size: 24px;
  }
}

/* Very narrow phones */
@media (max-width: 390px) {
  .page {
    padding: 4px;
  }

  .task-top {
    align-items: stretch;
  }

  .back-btn {
    flex: 1 1 auto;
  }

  .task-count {
    font-size: 12px;
  }

  .task-head {
    padding: 10px 9px;
  }

  .task-head h1 {
    font-size: 22px;
  }

  .task-head .room-tag {
    font-size: 11px;
    padding: 5px 7px;
  }

  .task-body {
    padding: 9px 7px 14px;
  }

  .note {
    font-size: 13px;
  }

  .story {
    font-size: 17px;
    line-height: 1.62;
  }

  select {
    max-width: 132px;
    font-size: 16px;
  }
}

/* Tablets in portrait */
@media (min-width: 701px) and (max-width: 920px) {
  .page {
    padding: 10px;
  }

  .hotel-stage {
    width: min(100%, 760px);
  }

  .story {
    font-size: 21px;
    line-height: 1.72;
  }

  .task-body {
    padding: 16px;
  }
}

</style>
</head>

let currentId = 1;

function getTask() {
  return TASKS.find(t => t.id === currentId);
}

function gapSelect(taskId, gap, options) {
  const opts = options.map((item, i) => `<option value="${i+1}">${i+1}) ${item}</option>`).join('');
  return `<span class="gap-wrap"><select id="gap-${taskId}-${gap}"><option value="">${gap}: choose</option>${opts}</select></span>`;
}

function openTask(id) {
  currentId = id;
  document.getElementById('hotelView').classList.add('hidden');
  document.getElementById('taskView').classList.remove('hidden');
  loadTask();
  window.scrollTo({top:0,behavior:'smooth'});
}

function goHotel() {
  document.getElementById('taskView').classList.add('hidden');
  document.getElementById('hotelView').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}

function loadTask() {
  const task = getTask();
  let body = task.text;
  Object.keys(task.options).forEach(gap => {
    body = body.replace(`${gap}_____`, gapSelect(task.id, gap, task.options[gap]));
  });

  document.getElementById('taskHeading').textContent = task.title;
  document.getElementById('storyTitle').textContent = task.title;
  document.getElementById('roomTag').textContent = `ROOM ${task.id}`;
  document.getElementById('taskCount').textContent = `Room ${task.id} / 4`;
  document.getElementById('storyText').innerHTML = body;

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  document.getElementById('tips').className = 'tips';
  document.getElementById('tips').innerHTML = '';
  document.getElementById('successBox').className = 'success-box';
  setProgress(0);
}

function setProgress(value) {
  document.getElementById('progressBar').style.width = value + '%';
}

function checkAnswers() {
  const task = getTask();
  const gaps = Object.keys(task.answers);
  let correct = 0;
  let answered = 0;
  let tips = '<strong>Разберём ошибки:</strong>';

  gaps.forEach(gap => {
    const select = document.getElementById(`gap-${task.id}-${gap}`);
    const wrap = select.parentElement;
    wrap.classList.remove('correct','incorrect');

    if (select.value) answered++;

    if (select.value === task.answers[gap]) {
      correct++;
      wrap.classList.add('correct');
    } else if (select.value) {
      wrap.classList.add('incorrect');
      const right = task.options[gap][Number(task.answers[gap])-1];
      tips += `<div class="tip"><strong>${gap}. Правильный ответ: ${right}.</strong><br>${task.explanations[gap]}</div>`;
    }
  });

  const feedback = document.getElementById('feedback');
  const tipsBox = document.getElementById('tips');
  const successBox = document.getElementById('successBox');

  successBox.className = 'success-box';

  if (!answered) {
    feedback.textContent = 'Сначала выбери хотя бы один ответ.';
    feedback.className = 'feedback show error';
    tipsBox.className = 'tips';
    return;
  }

  const total = gaps.length;
  const percent = Math.round(correct / total * 100);
  setProgress(percent);

  if (correct === total) {
    feedback.textContent = 'Perfect! Всё верно!';
    feedback.className = 'feedback show success';
    tipsBox.className = 'tips';
    successBox.className = 'success-box show';
  } else {
    const missing = total - answered;
    feedback.textContent = missing
      ? `Правильно ${correct} из ${total}. Ещё есть незаполненные пропуски.`
      : `Правильно ${correct} из ${total}. Посмотри объяснения и попробуй ещё раз.`;
    feedback.className = correct >= Math.ceil(total * .6) ? 'feedback show warn' : 'feedback show error';
    tipsBox.innerHTML = tips;
    tipsBox.className = tips.includes('class="tip"') ? 'tips show' : 'tips';
  }
}

function resetAnswers() {
  const task = getTask();
  Object.keys(task.answers).forEach(gap => {
    const select = document.getElementById(`gap-${task.id}-${gap}`);
    if (select) {
      select.value = '';
      select.parentElement.classList.remove('correct','incorrect');
    }
  });
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('tips').className = 'tips';
  document.getElementById('successBox').className = 'success-box';
  setProgress(0);
}

function showAnswers() {
  const task = getTask();
  Object.keys(task.answers).forEach(gap => {
    const select = document.getElementById(`gap-${task.id}-${gap}`);
    if (select) {
      select.value = task.answers[gap];
      select.parentElement.classList.remove('incorrect');
      select.parentElement.classList.add('correct');
    }
  });
  setProgress(100);
  const feedback = document.getElementById('feedback');
  feedback.textContent = 'Правильные ответы показаны.';
  feedback.className = 'feedback show success';
  document.getElementById('tips').className = 'tips';
  document.getElementById('successBox').className = 'success-box';
}

document.querySelectorAll('.room-hit').forEach(btn => {
  btn.addEventListener('click', () => openTask(Number(btn.dataset.id)));
});
document.getElementById('backBtn').addEventListener('click', goHotel);
document.getElementById('checkBtn').addEventListener('click', checkAnswers);
document.getElementById('resetBtn').addEventListener('click', resetAnswers);
document.getElementById('showBtn').addEventListener('click', showAnswers);
</script>
